name: briefing

on:
  schedule:
    - cron: "10 6 * * *" # 06:10 UTC: 06:10 in London in winter, 07:10 in summer
  workflow_dispatch:

permissions:
  id-token: write # OIDC to AWS, same deploy role as the site
  contents: read

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    name: build and publish briefing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build from feeds
        run: python3 -I briefing/build.py > briefing.json

      - name: Sanity check
        run: python3 -I -c "import json; d = json.load(open('briefing.json')); print(d['sources_ok'], 'sources ok, failed:', d['sources_failed'])"

      - uses: aws-actions/configure-aws-credentials@v6.2.3 # 22 Jul 2026, Node 24
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
          mask-aws-account-id: true

      - name: Publish
        run: >
          aws s3 cp briefing.json "s3://${{ secrets.SITE_BUCKET }}/briefing.json"
          --content-type "application/json; charset=utf-8"
          --cache-control "public, max-age=300"

      - name: Clear the cached copy
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ secrets.CF_DISTRIBUTION_ID }}"
          --paths "/briefing.json"
          --query Invalidation.Id --output text
