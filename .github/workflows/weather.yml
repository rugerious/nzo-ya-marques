name: weather

on:
  schedule:
    - cron: "17 * * * *" # every hour, off the busy :00 mark
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: weather
  cancel-in-progress: true

jobs:
  update:
    name: update weather
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch from Open-Meteo
        run: python3 -I briefing/weather.py > weather.json

      - uses: aws-actions/configure-aws-credentials@v6.3.0 # Node 24
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
          mask-aws-account-id: true

      # max-age=600: CloudFront and browsers refresh within 10 minutes, so no paid invalidation is needed.
      - name: Publish
        run: >
          aws s3 cp weather.json "s3://${{ secrets.SITE_BUCKET }}/weather.json"
          --content-type "application/json; charset=utf-8"
          --cache-control "public, max-age=600"
