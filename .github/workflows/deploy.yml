name: deploy

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # lets the job ask GitHub for an OIDC token
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  site:
    name: publish site
    runs-on: ubuntu-latest
    # No "environment:" here on purpose: it would change the OIDC subject the AWS role trusts.
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6.2.3 # 22 Jul 2026, Node 24
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
          mask-aws-account-id: true

      - name: Upload to S3
        run: aws s3 sync site/ "s3://${{ secrets.SITE_BUCKET }}" --delete

      - name: Clear CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ secrets.CF_DISTRIBUTION_ID }}"
          --paths "/*"
          --query Invalidation.Id --output text

      - name: Check the site answers
        run: curl -fsS -o /dev/null -w "%{http_code}\n" https://nzoyamarques.com
